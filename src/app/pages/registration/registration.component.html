<div class="container">
    <mat-card>
    <mat-card-content>
             <h3 class="mb-3 my-2 lab">REGISTRATION FORM</h3>
            <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

                <div class="row">
                    <div class="col-4">
                        <mat-form-field appearance="outline">
                            <mat-label>FullName</mat-label>
                            <input matInput placeholder="Enter your name" formControlName="fullName">
                        </mat-form-field>
                    </div>

                    <div class="col-4">
                        <mat-form-field appearance="outline">
                            <mat-label>Email</mat-label>
                            <input matInput placeholder="Enter your email" formControlName="email">
                        </mat-form-field>
                    </div>

                    <div class="col-4">
                        <mat-form-field appearance="outline">
                            <mat-label>MobileNo</mat-label>
                            <input matInput placeholder="Enter your mobile number" formControlName="mobileNo">
                        </mat-form-field>
                    </div>
                    
                </div>


                 <div class="row">
                    
                    <div class="col-4">
                        <mat-form-field appearance="outline">
                            <mat-label>Password</mat-label>
                            <input matInput placeholder="Enter your password" formControlName="password" type="password">
                        </mat-form-field>
                    </div>

                    <div class="col-4">
                        <mat-form-field appearance="outline">
                            <mat-label>Confirm Password</mat-label>
                            <input matInput placeholder="Confirm your password" formControlName="confirmPassword" type="password">
                        </mat-form-field>
                    </div>

                    <div class="col-4">
                        <!-- <mat-form-field appearance="outline">
                            <mat-label>Gender</mat-label>
                            <input matInput placeholder="Enter your gender" formControlName="gender">
                        </mat-form-field> -->
                        <mat-form-field appearance="outline">
                        <mat-label>Gender</mat-label>
                        <mat-select formControlName="gender">
                            <mat-option value="male">Male</mat-option>
                            <mat-option value="female">Female</mat-option>
                            <mat-option value="other">Other</mat-option>
                        </mat-select>
                    </mat-form-field>    
                    </div>
                    
                </div>
                
                <div class="row">
                <div class="col-4">
                    <mat-form-field appearance="outline" >
                        <mat-label>Country</mat-label>
                        <mat-select formControlName="country" (selectionChange)="onCountryChange()">
                            <mat-option>
                                <ngx-mat-select-search [formControl]="searchCountry" placeholderLabel="search"> </ngx-mat-select-search>
                            </mat-option>
                            <mat-option  *ngFor="let c of filteredCountries()" [value]="c">{{c.countryName}}</mat-option>
                        </mat-select>
                    </mat-form-field>    
                </div>

                <div class="col-4">
                    <mat-form-field appearance="outline" >
                        <mat-label>State</mat-label>
                        <mat-select formControlName="state" (selectionChange)="onStateChange()">
                            <mat-option>
                                <ngx-mat-select-search   [formControl]="searchState" placeholderLabel="search"> </ngx-mat-select-search>
                            </mat-option>
                            <mat-option  *ngFor="let s of filterState()" [value]="s">{{s.stateName}}</mat-option>
                        </mat-select>
                    </mat-form-field>    
                </div>

                <div class="col-4">
                    <mat-form-field appearance="outline" >
                        <mat-label>City</mat-label>
                        <mat-select formControlName="city">
                            <mat-option>
                                <ngx-mat-select-search   [formControl]="searchCity" placeholderLabel="search"> </ngx-mat-select-search>
                            </mat-option>
                            <mat-option  *ngFor="let c of filterCity()" [value]="c">{{c.cityName}}</mat-option>
                        </mat-select>
                    </mat-form-field>    
                </div> 
              </div>
    

    
    
    
    
    <div class="container">
                    <button type="submit" class="btn btn-secondary text-white">Submit</button>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
