<div class="d-flex justify-content-center align-items-center vh-100" style="background-color: cadetblue;">
    <div class="card w-100">
        <form onsubmit="onsubmit()" [formGroup]="loginForm">
            <div>
            <h3 class="mb-3 my-2 lab">LOGIN FORM</h3>
            </div>

            <div class="mb-3">
                <label class="fw-bold mx-2">UserName</label>
                 <i class="bi bi-person"></i>
                <input type="text" placeholder="enter username" class="form-control mb-3" formControlName="userName" />
            </div>
            
            <div>  
                <label class="fw-bold mx-2">Password</label>
                 <i class="bi bi-lock"></i>
                <input type="password" placeholder="enter password" class="form-control mb-3" formControlName="password"/>
            </div>

            <div class="center-btn">
                 <button type="submit" class="btn btn-primary mb-3" (click)="onsubmit()">LOGIN</button>
            </div>
        </form>

         <p class="register-text">
            Don't have an account?
            <a routerLink="/registration">Register here</a>

        </p>
    </div>
</div>
